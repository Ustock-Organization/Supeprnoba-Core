name: Deploy EC2 Services

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'wrapper/**'
      - 'aggregator/**'
      - 'streamer/**'
      - 'mm-service/**'
      - '.github/workflows/deploy-engine.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: engine,streamer,mm,aggregator or all)'
        required: false
        default: 'all'
        type: string
      build_only:
        description: 'Build only, skip restart'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Determine services to deploy
        id: services
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SERVICES="${{ github.event.inputs.services }}"
          else
            SERVICES="all"
          fi

          if [ "$SERVICES" == "all" ]; then
            SERVICES="engine,streamer,mm,aggregator"
          fi

          echo "list=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to deploy: $SERVICES"

      - name: Upload source to EC2
        run: |
          # SCP 기반 배포 (git pull 불가 환경)
          IFS=',' read -ra SVCS <<< "${{ steps.services.outputs.list }}"
          for svc in "${SVCS[@]}"; do
            case "$svc" in
              engine)
                echo "Uploading wrapper/ to EC2..."
                rsync -avz --delete \
                  --exclude='build/' --exclude='.git/' \
                  wrapper/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Supernoba-Core_Old/wrapper/
                ;;
              streamer)
                echo "Uploading streamer/ to EC2..."
                rsync -avz --delete \
                  --exclude='node_modules/' --exclude='.git/' \
                  streamer/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Supernoba-Core_Old/streamer/
                ;;
              mm)
                echo "Uploading mm-service/ to EC2..."
                rsync -avz --delete \
                  --exclude='node_modules/' --exclude='.git/' \
                  mm-service/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Supernoba-Core_Old/mm-service/
                ;;
              aggregator)
                echo "Uploading aggregator/ to EC2..."
                rsync -avz --delete \
                  --exclude='build/' --exclude='.git/' \
                  aggregator/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Supernoba-Core_Old/aggregator/
                ;;
            esac
          done

      - name: Build and restart services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e

          CTL="$HOME/Supernoba-Core_Old/deploy/supernoba-ctl.sh"

          # supernoba-ctl.sh 존재 확인
          if [ ! -x "$CTL" ]; then
            echo "supernoba-ctl.sh not found at $CTL"
            exit 1
          fi

          SERVICES="${{ steps.services.outputs.list }}"
          BUILD_ONLY="${{ github.event.inputs.build_only }}"

          IFS=',' read -ra SVCS <<< "$SERVICES"
          for svc in "${SVCS[@]}"; do
            echo ""
            echo "=========================================="
            echo "Processing: $svc"
            echo "=========================================="

            # 빌드 (build_service 함수 활용)
            echo "Building $svc..."
            # build 명령은 supernoba-ctl.sh에는 없으므로 직접 빌드
            case "$svc" in
              engine)
                cd ~/Supernoba-Core_Old/wrapper
                if [ ! -d build ]; then
                  cmake -B build -S . \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake
                fi
                cmake --build build -j$(nproc)
                ;;
              aggregator)
                cd ~/Supernoba-Core_Old/aggregator
                if [ ! -d build ]; then
                  cmake -B build -S . \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake
                fi
                cmake --build build -j$(nproc)
                ;;
              streamer)
                cd ~/Supernoba-Core_Old/streamer/node
                npm install --omit=dev
                ;;
              mm)
                cd ~/Supernoba-Core_Old/mm-service
                npm install --omit=dev
                ;;
            esac
            echo "Build complete for $svc"

            # 재시작 (build_only가 아닌 경우)
            if [ "$BUILD_ONLY" != "true" ]; then
              echo "Restarting $svc via systemd..."
              # 엔진 재시작 시 supernoba-ctl.sh가 MM pause/resume 처리
              if [ "$svc" == "engine" ]; then
                "$CTL" restart engine
              else
                sudo systemctl restart "supernoba-$svc"
              fi
              sleep 3
            fi
          done

          echo ""
          echo "=========================================="
          echo "Deployment complete!"
          echo "=========================================="
          ENDSSH

      - name: Verify services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          echo "=== Service Status ==="
          for svc in supernoba-engine supernoba-streamer supernoba-mm supernoba-aggregator; do
            STATUS=$(systemctl is-active $svc 2>/dev/null || echo "inactive")
            PID=$(systemctl show $svc --property=MainPID --value 2>/dev/null || echo "0")
            echo "$svc: $STATUS (PID: $PID)"
          done

          echo ""
          echo "=== Valkey 4-Cache PING ==="
          for port in 6379 6380 6381 6382; do
            PONG=$(redis-cli -h 127.0.0.1 -p $port PING 2>/dev/null || echo "FAIL")
            echo "Port $port: $PONG"
          done

          echo ""
          echo "=== Recent Logs ==="
          for logfile in /var/log/supernoba/engine/engine.log /var/log/supernoba/streamer/streamer.log /var/log/supernoba/mm-service/mm-service.log /var/log/supernoba/aggregator/aggregator.log; do
            if [ -f "$logfile" ]; then
              echo "--- $(basename $(dirname $logfile)) (last 3 lines) ---"
              tail -3 "$logfile"
            fi
          done
          ENDSSH

      - name: Send Slack notification
        if: always()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            if [ "${{ job.status }}" == "success" ]; then
              COLOR="good"
              STATUS="성공"
            else
              COLOR="danger"
              STATUS="실패"
            fi

            COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

            curl -s -X POST -H 'Content-type: application/json' \
              --data "{
                \"attachments\": [{
                  \"color\": \"$COLOR\",
                  \"title\": \"EC2 서비스 배포 결과\",
                  \"fields\": [
                    {\"title\": \"상태\", \"value\": \"$STATUS\", \"short\": true},
                    {\"title\": \"서비스\", \"value\": \"${{ steps.services.outputs.list }}\", \"short\": true},
                    {\"title\": \"브랜치\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                    {\"title\": \"커밋\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|$COMMIT_SHORT>\", \"short\": true}
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"ts\": $(date +%s)
                }]
              }" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
